---
name: Track upstream releases

# Runs updatecli on a schedule to detect new NousResearch/hermes-agent
# releases. On a new release it opens a PR bumping .upstream-version that
# auto-merges (squash); the merge pushes .upstream-version to main, which
# triggers release-riscv64.yml to build and publish the riscv64 image.
#
# Requires either:
#   - A PAT stored as the UPDATECLI_GITHUB_TOKEN secret (recommended), OR
#   - "Allow GitHub Actions to create and approve pull requests" enabled in
#     Settings → Actions → General (falls back to github.token when no PAT
#     secret is set).
# "Allow auto-merge" must be enabled in repo Settings → General.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  updatecli:
    name: updatecli pipeline apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install updatecli
        uses: updatecli/updatecli-action@4b17f4ea784de29f71f85f9bc4955402ba1ae53c # v2.100.0
      - name: Apply
        # Prefer the UPDATECLI_GITHUB_TOKEN PAT secret (allows PR creation even
        # when "Allow GitHub Actions to create pull requests" is disabled in
        # repo settings). Falls back to github.token when the secret is absent.
        env:
          UPDATECLI_GITHUB_TOKEN: ${{ secrets.UPDATECLI_GITHUB_TOKEN || github.token }}
        run: updatecli pipeline apply --config updatecli/updatecli.d/
