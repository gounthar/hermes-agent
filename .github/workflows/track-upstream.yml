---
name: Track upstream releases

# Runs updatecli on a schedule to detect new NousResearch/hermes-agent
# releases. On a new release it opens a PR bumping .upstream-version that
# auto-merges (squash); the merge pushes .upstream-version to main, which
# triggers release-riscv64.yml to build and publish the riscv64 image.
# Needs UPDATECLI_GITHUB_TOKEN (a PAT) + "Allow auto-merge" on the repo.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  updatecli:
    name: updatecli apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install updatecli
        uses: updatecli/updatecli-action@4b17f4ea784de29f71f85f9bc4955402ba1ae53c # v2.100.0
      - name: Apply
        # Use a dedicated PAT, NOT the default GITHUB_TOKEN: PRs opened with
        # GITHUB_TOKEN do not trigger other workflows, so the release-riscv64
        # build would never fire on merge. Set UPDATECLI_GITHUB_TOKEN as a repo
        # secret (a fine-grained PAT with contents + pull-requests write).
        env:
          UPDATECLI_GITHUB_TOKEN: ${{ secrets.UPDATECLI_GITHUB_TOKEN }}
        run: updatecli pipeline apply --config updatecli/updatecli.d/
